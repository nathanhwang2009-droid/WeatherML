[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weatherml"
version = "0.1.0"
description = "ML project for weather prediction with Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-env>=1.0.0",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N803", "N806"]  # Allow X, y for ML conventions

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherml"]
